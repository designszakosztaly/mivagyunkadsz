<!DOCTYPE html>
<html>
<head>
  <title>Design Szakosztály</title>
</head>
<body>
  <iframe 
    id="main-frame"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    const baseUrl = "https://script.google.com/macros/s/AKfycbz5JL3CwfTLegxYEJ7RabzBAza0xORvg-OUXu1ug4JLRuRc-gtW1Hw_HexmqmTFtz6tHw/exec";

    // Grab any query params from the current page URL
    const params = window.location.search; // e.g. "?page=something"

    const iframe = document.getElementById('main-frame');
    iframe.src = baseUrl + params;

    window.onload = function() {
      iframe.requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
