<!DOCTYPE html>
<html>
<head>
  <title>Design Szakosztály</title>
</head>
<body>
  <iframe
    id="main-frame"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    const baseUrl = "https://script.google.com/macros/s/AKfycbz5JL3CwfTLegxYEJ7RabzBAza0xORvg-OUXu1ug4JLRuRc-gtW1Hw_HexmqmTFtz6tHw/exec";
    const basePath = "/mivagyunkadsz/";

    // Did we arrive here via the 404 redirect? If so, restore the real path.
    const stored = sessionStorage.getItem('redirectPath');
    if (stored) {
      sessionStorage.removeItem('redirectPath');
      history.replaceState(null, "", stored); // put the clean URL back in the address bar
    }

    // Turn /mivagyunkadsz/form1  ->  ?page=form1
    let page = window.location.pathname.replace(basePath, "").replace(/\/$/, "");
    const param = page ? "?page=" + encodeURIComponent(page) : "";

    document.getElementById('main-frame').src = baseUrl + param;
  </script>
</body>
</html>
